site_name: Wedding Management System — Documentação Técnica
site_description: Plataforma SaaS de Gestão de Casamentos (Arquitetura, APIs, Regras de Negócio e Playbooks)
site_author: Rafael Pereira de Araújo
site_url: https://rafaelp122.github.io/wedding_management/
repo_url: https://github.com/Rafaelp122/wedding_management
repo_name: Rafaelp122/wedding_management
docs_dir: docs

exclude_docs: |
  superpowers/**

theme:
  name: material
  language: pt
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    # Modo automático conforme preferência do sistema
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Alternar para tema claro
    # Modo Claro (Light Mode — Sim, Aceito! Violet Aura)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Alternar para tema escuro
    # Modo Escuro (Dark Mode — Surface Dark #09090B / #18181B)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: Alternar para modo automático

  font:
    text: IBM Plex Sans
    code: JetBrains Mono

  features:
    - navigation.instant           # SPA instant loading
    - navigation.instant.prefetch  # Prefetch ao passar o mouse
    - navigation.instant.progress  # Barra de progresso no topo
    - navigation.tabs              # Abas de navegação superiores
    - navigation.tabs.sticky       # Abas fixas no scroll
    - navigation.sections          # Seções organizadas no menu lateral
    - navigation.expand            # Expande navegação por padrão
    - navigation.indexes           # Páginas de índice de seção automáticas
    - navigation.top               # Botão de voltar ao topo
    - navigation.tracking          # Sincroniza âncoras na URL
    - content.code.annotate        # Anotações em blocos de código
    - content.code.copy            # Botão de cópia de código
    - content.tabs.link            # Abas de código sincronizadas
    - search.suggest               # Sugestões inteligentes de busca
    - search.highlight             # Destaque de termos buscados
    - toc.follow                   # Scrollspy no sumário lateral

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: pt
  - minify:
      minify_html: true

validation:
  nav:
    omitted_files: info
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Início: index.md

  - Domínios & Negócio:
