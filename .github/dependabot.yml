version: 2
updates:
  # 1. Monitorar o Backend Python (Django Ninja)
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # 2. Monitorar o Frontend (React / Vite)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # 3. Monitorar a Landing Page (Astro)
  - package-ecosystem: "npm"
    directory: "/landing"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "landing-page"
    groups:
      landing-dependencies:
        patterns:
          - "*"

  # 4. Monitorar Provedores e Módulos do Terraform (IaC)
  - package-ecosystem: "terraform"
    directory: "/terraform"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "terraform"
    groups:
      terraform-dependencies:
        patterns:
          - "*"

  # 5. Manter as próprias GitHub Actions seguras e atualizadas
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci-cd"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # 6. Monitorar Imagens Docker (Dockerfile e docker-compose.yml)
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-dependencies:
        patterns:
          - "*"
