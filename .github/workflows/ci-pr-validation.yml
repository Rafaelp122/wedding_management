name: "CI PR Validation & Tests"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Filter Path Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/**'
            frontend:
              - 'frontend/**'
              - '.github/**'
            landing:
              - 'landing/**'
              - '.github/**'

  lint-and-typecheck:
    name: Code Lint & Typecheck
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & UV
        if: needs.detect-changes.outputs.backend == 'true'
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node & PNPM
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Python Ruff Lint & Mypy Typecheck
        if: needs.detect-changes.outputs.backend == 'true'
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-static-analysis-only # pragma: allowlist secret
          PYTHONPATH: .
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .

      - name: Frontend Typecheck & Oxlint
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          cd frontend
          pnpm run lint
          pnpm run type-check

  backend-tests:
    name: Backend Pytest & Migrations Check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & UV
        uses: ./.github/actions/setup-python-uv

      - name: Django Integrity Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-backend-tests # pragma: allowlist secret
        run: |
          cd backend
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput

      - name: Pytest Unit & Integration Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-backend-tests # pragma: allowlist secret
        run: cd backend && uv run pytest --cov=apps --cov-report=term --cov-report=xml -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          build-args: BUILD_SECRET_KEY=dummy-secret-key-for-collectstatic-32-chars # pragma: allowlist secret
          tags: wedding-backend:ci
          load: true
          push: false

      - name: Smoke Test Production Docker Image
        env:
          SMOKE_SECRET_KEY: dummy-ci-smoke-secret-key-at-least-32-characters # pragma: allowlist secret
        run: |
          container_name="wedding-backend-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker logs "$container_name" || true; docker rm -f "$container_name" > /dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" --publish 8080:8080 \
            --env SECRET_KEY="$SMOKE_SECRET_KEY" \
            --env DATABASE_URL=sqlite:////tmp/ci-smoke.sqlite3 \
            --env ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env SECURE_SSL_REDIRECT=False \
            wedding-backend:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Production container health check timed out after 30 seconds."
          exit 1

  frontend-tests:
    name: Frontend Vitest Unit Tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Vitest Suite
        run: |
          cd frontend
          pnpm run test:ci

      - name: Build Frontend
        if: github.event_name == 'pull_request'
        run: cd frontend && pnpm build

      - name: Check API Mock Isolation
        run: |
          if grep -rn -A2 'vi\.mock(' frontend/src/ --include='*.test.*' --include='*.spec.*' | grep '@/api/generated' | grep -v '/test-setup.ts'; then
            echo "ERROR: vi.mock of @/api/generated found in test file. All API mocks must be in test-setup.ts."
            exit 1
          fi
          echo "All API mocks are properly centralized."

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  contract-sync:
    name: API Contract Sync
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & UV
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm

      - name: Export OpenAPI & Generate Orval Client
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-contract-sync # pragma: allowlist secret
        run: |
          cd backend
          uv run python manage.py export_openapi_schema --api config.api.api --output ../openapi.json --indent 2 --settings=config.settings.development
          cd ../frontend
          pnpm run generate:api
          git diff --exit-code || (echo "::error::Os contratos OpenAPI ou hooks gerados pelo Orval estão desatualizados! Rode 'make sync-api' localmente." && exit 1)

  landing-check:
    name: Landing Page Build Check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: landing

      - name: Build Astro Landing Page
        run: |
          cd landing
          pnpm exec astro check
          pnpm build

  e2e:
    name: Playwright E2E
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-tests.yml

  deploy:
    name: Deploy Validated Push
    needs:
      - detect-changes
      - lint-and-typecheck
      - backend-tests
      - frontend-tests
      - contract-sync
      - landing-check
      - e2e
    if: always() && github.event_name == 'push' && !failure() && !cancelled()
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-deploy.yml
    secrets: inherit # pragma: allowlist secret
