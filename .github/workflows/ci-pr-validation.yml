name: "CI PR Validation & Tests"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Filter Path Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'frontend/**'
              - 'package.json'
            landing:
              - 'landing/**'

  lint-and-typecheck:
    name: Code Lint & Typecheck
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.landing == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & UV
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm

      - name: Python Ruff Lint & Mypy Typecheck
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-static-analysis-only # pragma: allowlist secret
          PYTHONPATH: .
        run: |
          cd backend
          uv run ruff check .
          uv run mypy .

      - name: Frontend Typecheck & Oxlint
        run: |
          cd frontend
          pnpm run lint
          pnpm run type-check

  backend-tests:
    name: Backend Pytest & Migrations Check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & UV
        uses: ./.github/actions/setup-python-uv

      - name: Django Integrity Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-backend-tests # pragma: allowlist secret
        run: |
          cd backend
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput

      - name: Pytest Unit & Integration Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-backend-tests # pragma: allowlist secret
        run: cd backend && uv run pytest --cov=apps --cov-report=term --cov-report=xml -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-tests:
    name: Frontend Vitest Unit Tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Vitest Suite
        run: |
          cd frontend
          pnpm test

  contract-sync:
    name: API OpenAPI & Orval Contract Sync
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & UV
        uses: ./.github/actions/setup-python-uv

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm

      - name: Export OpenAPI & Generate Orval Client
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: dummy-ci-key-for-contract-sync # pragma: allowlist secret
        run: |
          cd backend
          uv run python manage.py export_openapi_schema --api config.api.api --output ../openapi.json --indent 2 --settings=config.settings.development
          cd ../frontend
          pnpm run generate:api
          git diff --exit-code || (echo "::error::Os contratos OpenAPI ou hooks gerados pelo Orval estão desatualizados! Rode 'make sync-api' localmente." && exit 1)

  landing-check:
    name: Landing Page Build Check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.landing == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node & PNPM
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: landing

      - name: Build Astro Landing Page
        run: |
          cd landing
          pnpm build
