name: "Staging Environment Pipeline"

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  staging-deploy:
    name: "Deploy Staging Environment"
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-remote-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@v2
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        if: env.GCP_WIF_PROVIDER != ''
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan (Staging)
        run: terraform plan -var-file=environments/staging.tfvars -no-color -input=false
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
