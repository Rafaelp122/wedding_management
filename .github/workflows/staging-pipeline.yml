name: "Terraform Staging Plans"

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  staging-deploy:
    name: "Terraform Plan (Shared & Staging)"
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: terraform-remote-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init & Validate (Shared)
        working-directory: terraform/shared
        run: |
          terraform init
          terraform validate -no-color

      - name: Terraform Plan (Shared)
        working-directory: terraform/shared
        env:
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
        run: terraform plan -no-color -input=false

      - name: Terraform Init & Validate (Staging)
        working-directory: terraform/staging
        run: |
          terraform init
          terraform validate -no-color

      - name: Terraform Plan (Staging)
        working-directory: terraform/staging
        env:
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
        run: terraform plan -no-color -input=false
