name: "Terraform GitOps Pipeline"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/staging-pipeline.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/staging-pipeline.yml"

jobs:
  terraform-validation:
    name: "Terraform Format & Validate"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform

      - name: Terraform Init & Validate (Shared)
        working-directory: terraform/shared
        run: |
          terraform init -backend=false
          terraform validate -no-color

      - name: Terraform Init & Validate (Staging)
        working-directory: terraform/staging
        run: |
          terraform init -backend=false
          terraform validate -no-color

      - name: Terraform Init & Validate (Production)
        working-directory: terraform/production
        run: |
          terraform init -backend=false
          terraform validate -no-color

      - name: Terraform Module Unit Test
        working-directory: terraform/modules/gcp/cloud-run-service
        run: |
          terraform init -backend=false
          terraform test -no-color

  terraform-apply:
    name: "Terraform Apply (Production, Repository Opt-In)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform-validation
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-remote-state
      cancel-in-progress: false
    environment: Production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init (Shared)
        working-directory: terraform/shared
        run: terraform init

      - name: Terraform Plan (Shared)
        working-directory: terraform/shared
        env:
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform Apply (Shared)
        if: vars.TERRAFORM_PRODUCTION_APPLY_ENABLED == 'true'
        working-directory: terraform/shared
        env:
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
        run: terraform apply -input=false tfplan

      - name: Terraform Init (Production)
        working-directory: terraform/production
        run: terraform init

      - name: Terraform Plan (Production)
        working-directory: terraform/production
        env:
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform Apply (Production)
        if: vars.TERRAFORM_PRODUCTION_APPLY_ENABLED == 'true'
        working-directory: terraform/production
        env:
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_vercel_team_id: ${{ secrets.VERCEL_ORG_ID }}
        run: terraform apply -input=false tfplan
