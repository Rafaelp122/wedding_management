name: "Terraform GitOps Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    name: "Terraform Lint, Plan & Apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@v3
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        if: env.GCP_WIF_PROVIDER != ''
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' && env.GCP_WIF_PROVIDER != ''
        run: |
          terraform plan -var-file=environments/production.tfvars -no-color -input=false -out=tfplan | tee plan.txt
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Read Plan Output
        id: read_plan
        if: github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        run: |
          PLAN_OUTPUT=$(cat plan.txt | tail -n 100)
          echo "PLAN_STDOUT<<EOF" >> $GITHUB_ENV
          echo "$PLAN_OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment Plan on Pull Request
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${steps.fmt.outcome}\`
            #### Terraform Initialization ⚙️\`${steps.init.outcome}\`
            #### Terraform Validation 🤖\`${steps.validate.outcome}\`
            #### Terraform Plan 📖\`${steps.plan.outcome}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${process.env.PLAN_STDOUT || "Plan output not available"}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.GCP_WIF_PROVIDER != ''
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
        run: terraform apply -var-file=environments/production.tfvars -auto-approve -input=false
